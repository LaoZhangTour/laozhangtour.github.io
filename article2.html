<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何在 GitHub.io 搭建个人博客</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body{background:#0d1117;color:#c9d1d9;font-family:"Microsoft Yahei",sans-serif;line-height:2;}
        nav{background:#161b22;padding:15px 0;text-align:center;border-bottom:1px solid #30363d;}
        nav a{color:#58a6ff;text-decoration:none;font-size:16px;}
        .container{max-width:720px;margin:40px auto;padding:0 20px;}
        h1{color:#f0f6fc;margin-bottom:15px;font-size:24px;}
        .date{color:#8b949e;font-size:14px;margin-bottom:30px;}
        .content{font-size:16px;}
        footer{text-align:center;padding:40px 0;color:#6e7681;font-size:14px;border-top:1px solid #30363d;margin-top:50px;}
    </style>
</head>
<body>
<nav><a href="/">← 返回首页</a></nav>
<div class="container">
    <h1>如何在 GitHub.io 搭建个人博客</h1>
    <div class="date">2026-05-14</div>
    <div class="content">
        <p>1. 创建仓库：用户名.github.io</p>
        <p>2. 开启 GitHub Pages</p>
        <p>3. 根目录放 index.html，文章统一放在 posts 文件夹</p>
        <p>路径用 /posts/xxx.html 写法，兼容 GitHub Pages，不404。</p>
    </div>
</div>
<footer>© 2026 laozhangtour.github.io</footer>
</body>
</html>
