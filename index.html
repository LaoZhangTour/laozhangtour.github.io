<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老张的个人博客 | 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft Yahei", system-ui, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.8;
        }

        nav {
            background-color: #161b22;
            padding: 18px 0;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }

        nav h1 {
            font-size: 24px;
            color: #f0f6fc;
            font-weight: 500;
        }

        nav p {
            font-size: 14px;
            color: #8b949e;
        }

        .nav-links {
            margin-top: 12px;
        }

        .nav-links a {
            color: #8b949e;
            text-decoration: none;
            margin: 0 12px;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #58a6ff;
        }

        .container {
            max-width: 780px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-card {
            background-color: #161b22;
            border-radius: 14px;
            padding: 35px;
            text-align: center;
            border: 1px solid #30363d;
            margin-bottom: 30px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #30363d;
            margin-bottom: 18px;
        }

        .profile-card h2 {
            color: #f0f6fc;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .profile-card .desc {
            color: #8b949e;
            font-size: 15px;
        }

        .post {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .post:hover {
            border-color: #58a6ff;
            transform: translateY(-3px);
        }

        .post h3 a {
            color: #f0f6fc;
            font-size: 20px;
            text-decoration: none;
        }

        .post h3 a:hover {
            color: #58a6ff;
        }

        .date {
            font-size: 13px;
            color: #8b949e;
            margin: 10px 0;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: #6e7681;
            font-size: 14px;
            border-top: 1px solid #30363d;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav>
    <h1>老张的个人博客</h1>
    <p>记录 · 沉淀 · 成长</p>
    <div class="nav-links">
        <a href="/">首页</a>
        <a href="https://github.com/laozhangtour" target="_blank">GitHub</a>
    </div>
</nav>

<div class="container">
    <div class="profile-card">
        <img class="avatar" src="https://github.com/laozhangtour.png" alt="头像">
        <h2>LaoZhang 老张</h2>
        <p class="desc">热爱生活 | 喜欢旅行 | 记录技术与日常</p>
    </div>

    <!-- 文章链接已修复，不会404 -->
    <div class="post">
        <h3><a href="https://laozhangtour.github.io/posts/article1.html">欢迎来到我的暗黑风格博客</a></h3>
        <div class="date">2026-05-14</div>
        <p>基于 GitHub Pages 搭建纯静态暗黑主题博客，简洁干净，手机电脑都适配，无需服务器，永久免费托管。</p>
    </div>

    <div class="post">
        <h3><a href="https://laozhangtour.github.io/posts/article2.html">如何在 GitHub.io 搭建个人博客</a></h3>
        <div class="date">2026-05-14</div>
        <p>免费搭建个人博客全过程，不用服务器，直接托管在 GitHub。</p>
    </div>

</div>

<footer>
    © 2026 laozhangtour.github.io | Dark Theme Blog
</footer>

</body>
</html>
