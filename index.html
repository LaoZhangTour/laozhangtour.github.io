<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaoZhang Tour | 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #f5f7fa;
            color: #333;
            text-align: center;
            padding: 60px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #409eff;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #222;
        }
        .desc {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .links a {
            display: inline-block;
            margin: 8px 12px;
            padding: 10px 20px;
            background: #409eff;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }
        .links a:hover {
            background: #337ecc;
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 直接调用你GitHub账号头像，以后换头像这里自动更新 -->
        <img class="avatar" src="https://github.com/laozhangtour.png" alt="头像">
        <h1>老张 | LaoZhang</h1>
        <p class="desc">
            热爱生活 · 喜欢折腾技术<br>
            记录日常、分享旅行与编程
        </p>
        <div class="links">
            <a href="https://github.com/laozhangtour" target="_blank">GitHub</a>
            <a href="https://weibo.com/u/2230886424" target="_blank">个人博客</a>
            <a href="mailto:88347649@qq.com">联系邮箱</a>
        </div>
    </div>
    <div class="footer">
        © 2026 laozhangtour.github.io All Rights Reserved
    </div>
</body>
</html>
